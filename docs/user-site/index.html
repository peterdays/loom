<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting to loom</title>
  <!--
    User-site root redirect. This file does nothing while it lives in the loom
    repo: GitHub Pages serves peterdays.github.io/ only from a repository named
    peterdays.github.io. Publish this file as index.html in that repository
    (branch main, root) so https://peterdays.github.io/ lands on /loom/.
  -->
  <link rel="canonical" href="https://peterdays.github.io/loom/" />
  <meta http-equiv="refresh" content="0; url=https://peterdays.github.io/loom/" />
  <script>
    location.replace("https://peterdays.github.io/loom/" + location.search + location.hash);
  </script>
</head>
<body>
  <p><a href="https://peterdays.github.io/loom/">Continue to loom</a></p>
</body>
</html>
