# Private repo: these jobs spend GitHub Actions private free minutes
# (private repos do not get unlimited public minutes). Stdlib + node --check only.
name: validate-projects

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dual projects.json
        run: python3 scripts/add-node.py --validate-only

  page-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check app.js
        run: node --check public/app.js
      - name: Serve public/ and smoke-check the page
        run: python3 scripts/smoke-page.py
